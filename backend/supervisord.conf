; Local process supervisor for the API + campaign-send worker.
;
; The worker (app/worker.py) has to run continuously for queued campaign
; sends to ever leave "queued" -- it's a separate process from the API and
; nothing starts it automatically. Running both under supervisord means a
; crashed worker (or API) is restarted automatically instead of silently
; leaving every subsequent campaign stuck.
;
; Usage (from backend/):
;   supervisord -c supervisord.conf          # start both processes, daemonized
;   supervisorctl -c supervisord.conf status
;   supervisorctl -c supervisord.conf tail -f worker
;   supervisorctl -c supervisord.conf restart worker
;   supervisorctl -c supervisord.conf shutdown

[unix_http_server]
file=%(here)s/logs/supervisor.sock

[supervisord]
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/logs/supervisord.pid
directory=%(here)s
childlogdir=%(here)s/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

; Both programs run whatever `python`/`uvicorn` resolve to on supervisord's
; own PATH -- i.e. activate your venv/conda env *before* running
; `supervisord -c supervisord.conf`, same as you'd do for the manual
; commands in the README.

[program:api]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=%(here)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/logs/api.log
stderr_logfile=%(here)s/logs/api.log
environment=PYTHONUNBUFFERED="1"

[program:worker]
command=python -m app.worker
directory=%(here)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(here)s/logs/worker.log
stderr_logfile=%(here)s/logs/worker.log
environment=PYTHONUNBUFFERED="1"

[group:reach]
programs=api,worker
